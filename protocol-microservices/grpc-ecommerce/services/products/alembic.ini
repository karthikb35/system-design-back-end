# Alembic configuration — Products service (gRPC).
#
# DB-per-service: this migration history is INDEPENDENT of the users and orders
# services (each owns its own database and its own linear history). The database
# URL is deliberately NOT set here; migrations/env.py injects it from the service
# Settings (app.config) so migrations always target the same database the
# application uses. The transport (gRPC here, HTTP in the REST edition) is
# irrelevant to schema management — Alembic owns the database.

[alembic]
script_location = migrations
# Prepend the alembic.ini directory to sys.path so the `app` package imports.
prepend_sys_path = .

# Left blank on purpose — env.py sets it from Settings.database_url.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
