name: Study-guide PDFs

# Builds one PDF per study-guide book from its HTML source, but only for books
# that actually changed. Unchanged books are carried over from the previous
# "study-guide-pdfs" rolling release instead of being re-rendered — so a one-line
# edit to Book III does not spend CI minutes re-rendering the other six.
#
# Change detection (per book):
#   * that book's own HTML changed            -> rebuild it
#   * the shared CSS / renderer / this workflow changed -> rebuild ALL books
#   * otherwise                               -> reuse the PDF from the last release
#
# The publish job then republishes the full set (freshly built + carried over) so
# the rolling release always holds every current book.

on:
  push:
    branches: [main]
    paths:
      - "study-guide/**"
      - ".github/workflows/docs-pdf.yml"
  pull_request:
    paths:
      - "study-guide/**"
      - ".github/workflows/docs-pdf.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild every book PDF regardless of what changed"
        type: boolean
        default: false

# Avoid two release-publishing runs racing on the same branch.
concurrency:
  group: docs-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Detect which books changed. `dorny/paths-filter` compares against the
  #    push "before" SHA (or the PR base), so the very first run — where there is
  #    no baseline — treats everything as changed and bootstraps the full set.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed books
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changes }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'study-guide/architects-path.css'
              - 'study-guide/render_pdf.py'
              - '.github/workflows/docs-pdf.yml'
            b0:
              - 'study-guide/book-00-python-foundations.html'
            b0c:
              - 'study-guide/book-00-python-complete.html'
            b1:
              - 'study-guide/book-1-python-mastery.html'
            b2:
              - 'study-guide/book-2-dsa.html'
            b3:
              - 'study-guide/book-3-concurrency.html'
            b4:
              - 'study-guide/book-4-clean-code-patterns.html'
            b5:
              - 'study-guide/book-5-system-design.html'
            b6:
              - 'study-guide/book-6-backend-production.html'
            b7:
              - 'study-guide/book-7-networking-security-testing.html'
            master:
              - 'study-guide/The-Architects-Path.html'

  # ---------------------------------------------------------------------------
  # 2. One job per book (matrix). Each decides build-vs-reuse independently.
  # ---------------------------------------------------------------------------
  pdf:
    name: ${{ matrix.pdf }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: b0
            html: book-00-python-foundations.html
            pdf: Book-00-Python-Foundations.pdf
          - key: b0c
            html: book-00-python-complete.html
            pdf: Book-00-Python-Complete-Exhaustive.pdf
          - key: b1
            html: book-1-python-mastery.html
            pdf: Book-1-Python-Mastery.pdf
          - key: b2
            html: book-2-dsa.html
            pdf: Book-2-DSA.pdf
          - key: b3
            html: book-3-concurrency.html
            pdf: Book-3-Concurrency.pdf
          - key: b4
            html: book-4-clean-code-patterns.html
            pdf: Book-4-Clean-Code-Patterns.pdf
          - key: b5
            html: book-5-system-design.html
            pdf: Book-5-System-Design.pdf
          - key: b6
            html: book-6-backend-production.html
            pdf: Book-6-Backend-Production.pdf
          - key: b7
            html: book-7-networking-security-testing.html
            pdf: Book-7-Networking-Security-Testing.pdf
          - key: master
            html: The-Architects-Path.html
            pdf: The-Architects-Path.pdf
    env:
      # Rebuild this book if: forced, OR the shared assets changed, OR this
      # specific book's HTML changed.
      REBUILD: >-
        ${{ github.event.inputs.force_all == 'true'
            || needs.changes.outputs.shared == 'true'
            || contains(fromJSON(needs.changes.outputs.changed), matrix.key) }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan (build vs reuse)
        id: plan
        run: echo "mode=${{ env.REBUILD == 'true' && 'build' || 'reuse' }}" >> "$GITHUB_OUTPUT"

      # --- Reuse path: pull the existing PDF from the rolling release ----------
      - name: Reuse PDF from previous release
        if: steps.plan.outputs.mode == 'reuse'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          if gh release download study-guide-pdfs \
               --pattern "${{ matrix.pdf }}" --dir out --clobber 2>/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Reused ${{ matrix.pdf }} from release study-guide-pdfs."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "No prior asset for ${{ matrix.pdf }} — will build it instead."
          fi

      # --- Build path: render with headless Chromium ---------------------------
      # Runs when the book changed, or when reuse found no prior asset (bootstrap).
      - name: Set up Python
        if: steps.plan.outputs.mode == 'build' || steps.reuse.outputs.ok == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer (Chromium + fonts)
        if: steps.plan.outputs.mode == 'build' || steps.reuse.outputs.ok == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji fonts-liberation

      - name: Render PDF
        if: steps.plan.outputs.mode == 'build' || steps.reuse.outputs.ok == 'false'
        run: |
          mkdir -p out
          python study-guide/render_pdf.py \
            "study-guide/${{ matrix.html }}" "out/${{ matrix.pdf }}"

      # --- Hand the PDF (built or reused) to the publish job -------------------
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.key }}
          path: out/${{ matrix.pdf }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Republish the full set to the rolling release (push to main only).
  #    PRs stop at the build stage and leave the PDFs as run artifacts.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish rolling release
    needs: pdf
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          path: pdfs
          merge-multiple: true

      - name: Publish / refresh study-guide-pdfs release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: study-guide-pdfs
          name: Study-guide PDFs (latest)
          body: >-
            Auto-generated book PDFs. Each run rebuilds only the books whose HTML
            (or the shared CSS) changed; every other book is carried over
            unchanged from this release's previous revision.
          files: pdfs/*.pdf
