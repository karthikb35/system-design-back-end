name: Deploy study-guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'study-guide/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload study-guide folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: study-guide/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
