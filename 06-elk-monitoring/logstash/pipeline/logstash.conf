# =============================================================================
# Logstash pipeline: Beats input -> parse/enrich -> Elasticsearch output
# =============================================================================
# Design goals:
#   * Parse the app's structured JSON logs into first-class fields.
#   * Preserve the correlation_id / trace context for cross-service tracing.
#   * Write to a DATA STREAM whose backing indices are governed by ILM, so
#     retention/rollover is automatic (see architectural_notes.md).

input {
  beats {
    port => 5044
  }
}

filter {
  # Filebeat wraps the container's stdout line in `message`. If the app already
  # emits JSON, decode it so every field (level, latency_ms, correlation_id...)
  # becomes a searchable field in Elasticsearch instead of an opaque string.
  json {
    source => "message"
    skip_on_invalid_json => true
    target => "app"
  }

  # Promote the correlation/trace fields to a stable, queryable location.
  if [app][correlation_id] {
    mutate { add_field => { "[trace][correlation_id]" => "%{[app][correlation_id]}" } }
  }

  # Normalize the timestamp emitted by the app (@timestamp) if present.
  if [app][@timestamp] {
    date {
      match => ["[app][@timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Drop noisy health-check lines to control volume/cost (tune to taste).
  if [app][path] == "/health" or [app][path] == "/healthz" {
    drop { }
  }

  # GUARDRAIL: cap accidental high-cardinality/huge fields to avoid mapping
  # explosions and oversized documents (see gotchas in architectural_notes.md).
  mutate {
    remove_field => ["host", "agent", "ecs", "input", "log"]  # trim Beats metadata
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    # Write to a DATA STREAM (time-series). ILM handles rollover + retention.
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "fastapi"
    data_stream_namespace => "prod"
    # TODO(prod): ssl_enabled => true and provide CA cert.
  }

  # Optional: uncomment to debug the parsed structure on Logstash's own stdout.
  # stdout { codec => rubydebug }
}
